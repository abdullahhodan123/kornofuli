{% extends "base.html" %}
{% block title %}Delete {{ info.label }}{% endblock %}

{% block extra_css %}
<style>
  .m-page {
    max-width: 520px;
    margin: 0 auto;
    padding: 4rem 2rem;
  }

  .m-card {
    background: var(--white);
    border: 1px solid var(--gray-border);
    border-radius: var(--radius);
    padding: 2rem;
    text-align: center;
  }

  .m-icon {
    width: 52px;
    height: 52px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--red-bg);
    color: var(--red-text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
  }

  .m-card h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--gray-text);
    margin-bottom: 8px;
  }

  .m-card p {
    font-size: 13.5px;
    color: var(--gray-muted);
    margin-bottom: 20px;
  }

  .m-target {
    display: inline-block;
    background: var(--gray-bg);
    border: 1px solid var(--gray-border);
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    font-size: 13.5px;
    color: var(--gray-text);
    margin-bottom: 20px;
  }

  .m-actions { display: flex; gap: 10px; justify-content: center; }
  .m-submit {
    padding: 10px 22px;
    background: var(--red-text);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .m-submit:hover { background: #7f1d1d; }
  .m-cancel {
    display: inline-flex;
    align-items: center;
    padding: 10px 22px;
    border: 0.5px solid var(--gray-border);
    border-radius: var(--radius-sm);
    color: var(--gray-text);
    font-size: 14px;
    text-decoration: none;
    background: #fff;
  }
  .m-cancel:hover { background: var(--gray-bg); }
</style>
{% endblock %}

{% block content %}
<div class="m-page">

  <div class="m-card">
    <div class="m-icon"><i class="ti ti-alert-triangle"></i></div>
    <h1>Delete this {{ info.label|slice:":-1"|lower }}?</h1>
    <p>This action cannot be undone.</p>

    <div class="m-target">
      <i class="ti ti-tag"></i>
      {{ object }}
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="m-actions">
        <button class="m-submit" type="submit">Yes, Delete</button>
        <a class="m-cancel" href="{% url 'manage_content' model_key %}">Cancel</a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
